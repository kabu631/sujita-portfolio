    (function() {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            const b = document.querySelector('base');
            if (b) b.href = './';
        }

        // Intercept history.replaceState and history.pushState so Inertia router NEVER replaces subpath with '/'
        const repoPath = '/sujita-portfolio';
        const isGhPages = window.location.hostname.endsWith('github.io') || window.location.pathname.startsWith(repoPath);
        const _origReplace = history.replaceState;
        const _origPush = history.pushState;

        function sanitizeUrl(url) {
            if (!url || !isGhPages) return url;
            let str = String(url);
            if (str === '/' || str === '' || str === '/#' || str === '#') {
                return window.location.pathname.startsWith(repoPath) ? window.location.pathname : (repoPath + '/');
            }
            if (str.startsWith('/') && !str.startsWith(repoPath)) {
                return repoPath + str;
            }
            return url;
        }

        history.replaceState = function(state, title, url) {
            return _origReplace.call(this, state, title, sanitizeUrl(url));
        };

        history.pushState = function(state, title, url) {
            return _origPush.call(this, state, title, sanitizeUrl(url));
        };
    })();
